name: Repository CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authority-packages:
    name: Authority package validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate RBE-001 package
        run: python scripts/build_rbe001_v1_1_package.py --check
      - name: Validate RBM-001 package
        run: python scripts/validate_rbm001_package.py --check

  quality:
    name: Lint and compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint RBE runtime and authority boundary
        run: >-
          python -m ruff check board commercial controlled_authority rbe_runtime scripts study_bridge
          tests/test_rbe_runtime_*.py tests/test_rbe001_package.py
          tests/test_rbm001_package.py tests/test_study_bridge_*.py tests/test_commercial_pipeline.py tests/test_board_*.py tests/test_agent_seat_authority.py
      - name: Compile Python modules
        run: >-
          python -m compileall -q board commercial controlled_authority rbe_runtime scripts study_bridge
      - name: Assert the study bridge depends on the runtime, never the reverse
        run: >-
          if grep -rn "study_bridge" rbe_runtime controlled_authority; then
          echo "rbe_runtime and controlled_authority must not depend on study_bridge";
          exit 1; fi

  runtime-tests:
    name: RBE runtime tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run focused runtime suite
        run: python -m pytest -p no:cacheprovider tests/test_rbe_runtime_*.py -q

  repository-tests:
    name: Repository tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run complete repository suite
        run: python -m pytest -p no:cacheprovider -q
